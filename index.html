<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Rocket</title>
    <!-- Tailwind via CDN (apenas para desenvolvimento) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
   
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'rocket-yellow': {
                            '300': '#FDE68A',
                            '400': '#FDE047',
                            '500': '#FACC15',
                            '600': '#EAB308',
                        },
                        'rocket-dark': '#111827'
                    }
                }
            }
        }
    </script>
   
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .page, .page-content, .modal, .modal-tab-content {
            display: none;
        }
        .page.active, .page-content.active, .modal.active, .modal-tab-content.active {
            display: block;
        }
        .modal.active {
            display: flex;
        }
        .hidden { display: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
       
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .nav-link.active-nav {
            background-color: #FACC15;
            color: #111827;
            font-weight: 600;
        }
       
        [id^="kanban-col-"] {
            min-height: 200px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }
        .modal-tab-link {
            padding: 8px 12px;
            font-size: 0.875rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            color: #6b7280;
            cursor: pointer;
        }
        .modal-tab-link.active-tab {
            border-color: #FACC15;
            color: #FACC15;
        }
        .comment-item {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .comment-item p {
            font-size: 0.875rem;
            color: #374151;
            white-space: pre-wrap;
        }
        .comment-item span {
            font-size: 0.75rem;
            color: #9ca3af;
        }
       
        @media (max-width: 768px) {
            .grid-cols-1.md\\:grid-cols-3 {
                grid-template-columns: repeat(3, minmax(250px, 1fr));
                overflow-x: auto;
                gap: 1rem;
            }
            .kanban-column {
                min-width: 250px;
            }
            button, input, select, textarea {
                padding: 0.75rem;
                font-size: 1rem;
            }
            .modal {
                padding: 1rem;
            }
            .page-content {
                padding: 1rem;
            }
            aside { display: none; }
            .text-sm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        }
        .draggable {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-gray-100">

    <!-- Tela de Carregamento -->
    <div id="auth-page" class="page active">
        <div class="flex min-h-screen items-center justify-center bg-rocket-dark text-white p-4">
            <div class="w-full max-w-md bg-gray-900 p-8 rounded-lg shadow-xl text-center">
                <h1 class="text-3xl font-bold text-rocket-yellow-400 mb-2">CRM Rocket</h1>
                <p class="text-gray-400 mb-6">A carregar os seus dados...</p>
            </div>
        </div>
    </div>

    <!-- App Principal -->
    <div id="app-page" class="page">
        <div class="flex h-screen">
            <!-- Sidebar Desktop -->
            <aside class="w-64 bg-rocket-dark text-white hidden md:flex flex-col p-4">
                <div class="p-4 rounded-lg mb-8">
                    <img src="https://placehold.co/200x50/111827/FDE047?text=Rocket+For+Eat" alt="Logo" class="w-auto h-12 mx-auto">
                </div>
                <nav class="flex-1 space-y-2">
                    <button data-page="dashboardPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="layout-dashboard"></i> Dashboard
                    </button>
                    <button data-page="prospectsPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="kanban-square"></i> Prospecção
                    </button>
                    <button data-page="clientsPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="users"></i> Clientes
                    </button>
                </nav>
            </aside>

            <!-- Menu Mobile -->
            <div id="mobileMenu" class="fixed inset-0 bg-rocket-dark text-white z-50 hidden flex-col p-4">
                <div class="flex justify-between items-center mb-8">
                    <img src="https://placehold.co/200x50/111827/FDE047?text=Rocket+For+Eat" alt="Logo" class="w-auto h-10">
                    <button id="closeMobileMenuBtn"><i data-lucide="x" class="w-6 h-6"></i></button>
                </div>
                <nav class="flex-1 space-y-2">
                    <button data-page="dashboardPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700">Dashboard</button>
                    <button data-page="prospectsPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700">Prospecção</button>
                    <button data-page="clientsPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700">Clientes</button>
                </nav>
            </div>

            <!-- Conteúdo -->
            <main class="flex-1 overflow-y-auto p-4 md:p-8">
                <div class="md:hidden flex justify-between items-center mb-4">
                    <h1 class="text-xl font-bold text-rocket-dark">CRM Rocket</h1>
                    <button id="mobileMenuBtn"><i data-lucide="menu" class="w-6 h-6"></i></button>
                </div>

                <!-- Dashboard -->
                <div id="dashboardPage" class="page-content active">
                    <h2 class="text-3xl font-bold text-gray-800 mb-6 hidden md:block">Dashboard</h2>
                    <div class="bg-white p-6 rounded-lg shadow-md">
                        <p class="text-lg">Tudo funcionando! Clique em <strong>Prospecção</strong> para começar.</p>
                    </div>
                </div>

                <!-- Prospecção -->
                <div id="prospectsPage" class="page-content">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-3xl font-bold text-gray-800">Prospecção</h2>
                        <button id="addProspectBtn" class="bg-rocket-yellow-400 hover:bg-rocket-yellow-500 text-rocket-dark font-semibold py-2 px-4 rounded-lg flex items-center gap-2">
                            <i data-lucide="plus"></i> Novo Prospect
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 overflow-x-auto">
                        <div class="kanban-column bg-gray-50 p-4 rounded-lg">
                            <h3 class="font-semibold text-gray-700 mb-3">Novo</h3>
                            <div id="col-novo" class="space-y-3"></div>
                        </div>
                        <div class="kanban-column bg-gray-50 p-4 rounded-lg">
                            <h3 class="font-semibold text-gray-700 mb-3">Contato Inicial</h3>
                            <div id="col-contato" class="space-y-3"></div>
                        </div>
                        <div class="kanban-column bg-gray-50 p-4 rounded-lg">
                            <h3 class="font-semibold text-gray-700 mb-3">Proposta Enviada</h3>
                            <div id="col-proposta" class="space-y-3"></div>
                        </div>
                    </div>
                </div>

                <!-- Clientes -->
                <div id="clientsPage" class="page-content">
                    <h2 class="text-3xl font-bold text-gray-800 mb-6">Clientes</h2>
                    <p>Em breve...</p>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Prospect -->
    <div id="prospectModal" class="modal fixed inset-0 bg-black bg-opacity-50 z-50 items-center justify-center">
        <div class="bg-white rounded-lg shadow-xl w-full max-w-4xl max-h-screen overflow-y-auto m-4">
            <div class="p-6 border-b">
                <div class="flex justify-between items-center">
                    <h3 id="modalTitle" class="text-xl font-semibold">Novo Prospect</h3>
                    <button id="closeProspectModal" class="text-gray-500 hover:text-gray-700">
                        <i data-lucide="x" class="w-6 h-6"></i>
                    </button>
                </div>
            </div>

            <div class="p-6">
                <div class="flex space-x-4 mb-6 border-b">
                    <button class="modal-tab-link active-tab" data-tab="details">Detalhes</button>
                    <button class="modal-tab-link" data-tab="notes">Notas</button>
                </div>

                <!-- Detalhes -->
                <div id="tab-details" class="modal-tab-content active">
                    <form id="prospectForm">
                        <input type="hidden" id="prospectId">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                            <input type="text" id="prospectName" placeholder="Nome" class="px-3 py-2 border rounded-md w-full" required>
                            <input type="text" id="prospectCompany" placeholder="Empresa" class="px-3 py-2 border rounded-md w-full">
                            <input type="email" id="prospectEmail" placeholder="Email" class="px-3 py-2 border rounded-md w-full">
                            <input type="tel" id="prospectPhone" placeholder="Telefone" class="px-3 py-2 border rounded-md w-full">
                            <input type="number" id="prospectValue" placeholder="Valor Estimado" step="0.01" class="px-3 py-2 border rounded-md w-full">
                            <select id="prospectStatus" class="px-3 py-2 border rounded-md w-full">
                                <option value="novo">Novo</option>
                                <option value="contato">Contato Inicial</option>
                                <option value="proposta">Proposta Enviada</option>
                            </select>
                        </div>
                        <div class="flex justify-end gap-3">
                            <button type="button" id="cancelBtn" class="px-4 py-2 border rounded-md">Cancelar</button>
                            <button type="submit" class="bg-rocket-yellow-400 hover:bg-rocket-yellow-500 text-rocket-dark font-semibold py-2 px-4 rounded-lg">
                                Salvar
                            </button>
                        </div>
                    </form>
                </div>

                <!-- Notas -->
                <div id="tab-notes" class="modal-tab-content">
                    <div class="mb-4">
                        <textarea id="newNote" placeholder="Escreva uma nota..." class="w-full px-3 py-2 border rounded-md" rows="3"></textarea>
                        <button id="addNoteBtn" class="mt-2 bg-rocket-yellow-400 hover:bg-rocket-yellow-500 text-rocket-dark font-semibold py-2 px-4 rounded-lg">Adicionar</button>
                    </div>
                    <div id="notesContainer" class="space-y-3"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Dados locais (seus prospects)
        let prospects = JSON.parse(localStorage.getItem('crm-prospects')) || [
            { id: 1, name: "João Silva", company: "TechCorp", email: "joao@tech.com", phone: "(11) 98765-4321", value: 5000, status: "novo", notes: [] },
            { id: 2, name: "Maria Oliveira", company: "Inova Ltda", email: "maria@inova.com", phone: "(19) 91234-5678", value: 12000, status: "contato", notes: [{ text: "Interessada no plano premium", date: new Date().toISOString() }] }
        ];

        let currentProspect = null;

        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();

            // Simula carregamento
            setTimeout(() => {
                document.getElementById('auth-page').classList.remove('active');
                document.getElementById('app-page').classList.add('active');
                loadProspects();
                activatePage('dashboardPage');
            }, 800);

            setupEvents();
        });

        function setupEvents() {
            // Navegação
            document.querySelectorAll('.nav-link').forEach(btn => {
                btn.addEventListener('click', () => {
                    const page = btn.dataset.page;
                    activatePage(page);
                    if (window.innerWidth < 768) {
                        document.getElementById('mobileMenu').classList.add('hidden');
                    }
                });
            });

            document.getElementById('mobileMenuBtn')?.addEventListener('click', () => {
                document.getElementById('mobileMenu').classList.remove('hidden');
            });
            document.getElementById('closeMobileMenuBtn')?.addEventListener('click', () => {
                document.getElementById('mobileMenu').classList.add('hidden');
            });

            // Modal
            const modal = document.getElementById('prospectModal');
            document.getElementById('closeProspectModal').onclick = () => modal.classList.remove('active');
            document.getElementById('cancelBtn').onclick = () => modal.classList.remove('active');
            modal.onclick = (e) => { if (e.target === modal) modal.classList.remove('active'); };

            // Abas
            document.querySelectorAll('.modal-tab-link').forEach(tab => {
                tab.onclick = () => {
                    document.querySelectorAll('.modal-tab-link').forEach(t => t.classList.remove('active-tab'));
                    document.querySelectorAll('.modal-tab-content').forEach(c => c.classList.remove('active'));
                    tab.classList.add('active-tab');
                    document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
                };
            });

            // Novo Prospect
            document.getElementById('addProspectBtn').onclick = () => openProspectModal();

            // Salvar
            document.getElementById('prospectForm').onsubmit = (e) => {
                e.preventDefault();
                const data = {
                    id: document.getElementById('prospectId').value || Date.now(),
                    name: document.getElementById('prospectName').value,
                    company: document.getElementById('prospectCompany').value,
                    email: document.getElementById('prospectEmail').value,
                    phone: document.getElementById('prospectPhone').value,
                    value: parseFloat(document.getElementById('prospectValue').value) || 0,
                    status: document.getElementById('prospectStatus').value,
                    notes: currentProspect?.notes || []
                };

                const index = prospects.findIndex(p => p.id == data.id);
                if (index >= 0) prospects[index] = data;
                else prospects.push(data);

                localStorage.setItem('crm-prospects', JSON.stringify(prospects));
                loadProspects();
                modal.classList.remove('active');
            };

            // Nota
            document.getElementById('addNoteBtn').onclick = () => {
                const text = document.getElementById('newNote').value.trim();
                if (text && currentProspect) {
                    currentProspect.notes.push({ text, date: new Date().toISOString() });
                    localStorage.setItem('crm-prospects', JSON.stringify(prospects));
                    loadNotes();
                    document.getElementById('newNote').value = '';
                }
            };
        }

        function activatePage(pageId) {
            document.querySelectorAll('.page-content').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active-nav'));
            document.querySelector(`[data-page="${pageId}"]`).classList.add('active-nav');
        }

        function openProspectModal(prospect = null) {
            currentProspect = prospect;
            document.getElementById('modalTitle').textContent = prospect ? 'Editar Prospect' : 'Novo Prospect';
            document.getElementById('prospectId').value = prospect?.id || '';
            document.getElementById('prospectName').value = prospect?.name || '';
            document.getElementById('prospectCompany').value = prospect?.company || '';
            document.getElementById('prospectEmail').value = prospect?.email || '';
            document.getElementById('prospectPhone').value = prospect?.phone || '';
            document.getElementById('prospectValue').value = prospect?.value || '';
            document.getElementById('prospectStatus').value = prospect?.status || 'novo';

            loadNotes();
            document.getElementById('prospectModal').classList.add('active');
        }

        function loadNotes() {
            const container = document.getElementById('notesContainer');
            container.innerHTML = '';
            const notes = (currentProspect?.notes || []).sort((a, b) => new Date(b.date) - new Date(a.date));
            notes.forEach(note => {
                const div = document.createElement('div');
                div.className = 'comment-item';
                div.innerHTML = `<p>${note.text}</p><span>${new Date(note.date).toLocaleString('pt-BR')}</span>`;
                container.appendChild(div);
            });
        }

        function loadProspects() {
            ['novo', 'contato', 'proposta'].forEach(status => {
                const col = document.getElementById(`col-${status}`);
                col.innerHTML = '';
                prospects
                    .filter(p => p.status === status)
                    .forEach(p => {
                        const card = document.createElement('div');
                        card.className = 'bg-white p-4 rounded-lg shadow cursor-pointer hover:shadow-md';
                        card.innerHTML = `
                            <h4 class="font-semibold">${p.name}</h4>
                            <p class="text-sm text-gray-600">${p.company}</p>
                            <p class="text-sm font-medium text-rocket-yellow-600">R$ ${p.value.toFixed(2)}</p>
                        `;
                        card.onclick = () => openProspectModal(p);
                        col.appendChild(card);
                    });
            });
        }
    </script>
</body>
</html>
