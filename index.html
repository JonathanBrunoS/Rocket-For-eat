<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Rocket</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
   
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'rocket-yellow': {
                            '300': '#FDE68A',
                            '400': '#FDE047',
                            '500': '#FACC15',
                            '600': '#EAB308',
                        },
                        'rocket-dark': '#111827'
                    }
                }
            }
        }
    </script>
   
    <style>
        body {
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .page, .page-content, .modal, .modal-tab-content {
            display: none;
        }
        .page.active, .page-content.active, .modal.active, .modal-tab-content.active {
            display: block;
        }
        .modal.active {
            display: flex;
        }
        .hidden { display: none; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
       
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .nav-link.active-nav {
            background-color: #FACC15;
            color: #111827;
            font-weight: 600;
        }
       
        [id^="kanban-col-"] {
            min-height: 200px;
            max-height: calc(100vh - 300px);
            overflow-y: auto;
        }
        .modal-tab-link {
            padding: 8px 12px;
            font-size: 0.875rem;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            color: #6b7280;
            cursor: pointer;
        }
        .modal-tab-link.active-tab {
            border-color: #FACC15;
            color: #FACC15;
        }
        .modal-tab-content.active {
            display: block;
        }
        .comment-item {
            background-color: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 10px;
        }
        .comment-item p {
            font-size: 0.875rem;
            color: #374151;
            white-space: pre-wrap;
        }
        .comment-item span {
            font-size: 0.75rem;
            color: #9ca3af;
        }
       
        /* Mobile Otimizações */
        @media (max-width: 768px) {
            .grid-cols-1.md\\:grid-cols-3 {
                grid-template-columns: repeat(3, minmax(250px, 1fr));
                overflow-x: auto;
                gap: 1rem;
            }
            .kanban-column {
                min-width: 250px;
            }
            button, input, select, textarea {
                padding: 0.75rem;
                font-size: 1rem;
            }
            .modal {
                padding: 1rem;
            }
            .page-content {
                padding: 1rem;
            }
            aside { display: none; }
            .text-sm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        }
        .draggable {
            touch-action: none;
        }
    </style>
</head>
<body class="bg-gray-100">
    <div id="auth-page" class="page active">
        <div class="flex min-h-screen items-center justify-center bg-rocket-dark text-white p-4">
            <div class="w-full max-w-md bg-gray-900 p-8 rounded-lg shadow-xl text-center">
                <h1 class="text-3xl font-bold text-rocket-yellow-400 mb-2">CRM Rocket</h1>
                <p class="text-gray-400 mb-6">A carregar os seus dados...</p>
                <div id="authError" class="text-red-400 text-sm mt-4 hidden"></div>
            </div>
        </div>
    </div>
    <div id="app-page" class="page">
        <div class="flex h-screen">
            <aside class="w-64 bg-rocket-dark text-white hidden md:flex flex-col p-4">
                <div class="p-4 rounded-lg mb-8">
                    <img src="https://placehold.co/200x50/111827/FDE047?text=Rocket+For+Eat" alt="Logo" class="w-auto h-12 mx-auto" onerror="this.src='https://placehold.co/200x50/111827/FDE047?text=Sua+Logo'; this.onerror=null;">
                </div>
                <nav class="flex-1 space-y-2">
                    <button data-page="dashboardPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="layout-dashboard"></i>
                        <span>Dashboard</span>
                    </button>
                    <button data-page="prospectsPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="kanban-square"></i>
                        <span>Prospecção</span>
                    </button>
                    <button data-page="clientsPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="users"></i>
                        <span>Clientes</span>
                    </button>
                    <button data-page="receivablesPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="dollar-sign"></i>
                        <span>Contas a Receber</span>
                    </button>
                    <button data-page="expensesPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="trending-down"></i>
                        <span>Despesas</span>
                    </button>
                    <button data-page="globalTasksPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="check-square"></i>
                        <span>Tarefas Globais</span>
                    </button>
                    <button data-page="reportsPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="archive"></i>
                        <span>Relatórios</span>
                    </button>
                    <button data-page="companyPage" class="nav-link flex items-center gap-3 w-full p-3 rounded-md text-sm font-medium hover:bg-gray-700 transition-colors">
                        <i data-lucide="target"></i>
                        <span>Minha Empresa</span>
                    </button>
                </nav>
                <div class="mt-auto"></div>
            </aside>
           
            <div id="mobileMenu" class="fixed inset-0 bg-rocket-dark text-white z-50 hidden flex-col p-4">

                   <button id="closeMobileMenuBtn">

                 </nav>
            </div>

                        <i data-lucide="menu" class="w-6 h-6 text-rocket-dark"></i>

                </div>
